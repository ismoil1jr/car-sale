<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="meta.adminTitle">Boshqaruv paneli (demo) — Inomarka Bor</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#09090a">
  <link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,600;0,700;0,800;1,700;1,800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Asosiy kontentga oʻtish</a>
  <div id="site-header"></div>

  <main id="main">
    <!-- Kirish -->
    <section class="container" id="login-view" hidden>
      <form class="panel admin-login" id="login-form">
        <div class="modal__icon" style="margin:0 auto 18px"><i data-icon="lock"></i></div>
        <h1 style="text-align:center;font-size:26px" data-i18n="admin.loginTitle">Boshqaruv paneli</h1>
        <p style="text-align:center;color:var(--muted);margin:8px 0 22px" data-i18n="admin.loginText">Eʼlonlarni qoʻshish, tahrirlash va statusini oʻzgartirish uchun kiring.</p>
        <div class="field">
          <label for="pwd" data-i18n="admin.password">Parol</label>
          <input class="input" id="pwd" type="password" autocomplete="current-password" required>
          <span class="field__error" data-i18n="admin.wrong">Parol notoʻgʻri</span>
        </div>
        <button class="btn btn--gold btn--block" type="submit" style="margin-top:16px" data-i18n="admin.login">Kirish</button>
        <p class="field__hint" style="text-align:center;margin-top:14px"><span data-i18n="admin.demoHint">Demo parol:</span> <b id="demo-pwd"></b></p>
      </form>
    </section>

    <!-- Panel -->
    <section class="section section--tight" id="dash-view" hidden>
      <div class="container">
        <div class="section-head" style="margin-bottom:24px">
          <div class="section-head__text">
            <span class="eyebrow" data-i18n="admin.eyebrow">Demo · maʼlumotlar shu brauzerda saqlanadi</span>
            <h1 class="section-title" data-i18n="admin.title">Boshqaruv paneli</h1>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn btn--gold" type="button" id="add-car"><i data-icon="plus"></i><span data-i18n="admin.add">Yangi eʼlon</span></button>
            <a class="btn" href="index.html" target="_blank" rel="noopener"><i data-icon="external"></i><span data-i18n="admin.viewSite">Saytni koʻrish</span></a>
            <button class="btn" type="button" id="logout"><i data-icon="logout"></i><span data-i18n="admin.logout">Chiqish</span></button>
          </div>
        </div>

        <div class="admin-stats" id="stats"></div>

        <div class="toolbar" style="margin-top:28px">
          <div class="filter-chips" role="tablist">
            <button class="filter-chip is-active" type="button" role="tab" data-tab="cars" aria-selected="true"><span data-i18n="admin.tabCars">Eʼlonlar</span></button>
            <button class="filter-chip" type="button" role="tab" data-tab="leads" aria-selected="false"><span data-i18n="admin.tabLeads">Arizalar</span> <span id="leads-count"></span></button>
          </div>
          <div class="toolbar__right">
            <button class="btn btn--sm" type="button" id="reset-demo"><i data-icon="refresh"></i><span data-i18n="admin.reset">Demo maʼlumotlarni tiklash</span></button>
          </div>
        </div>

        <div id="tab-cars">
          <div class="admin-bar">
            <div class="search-input"><i data-icon="search"></i><input class="input" type="search" id="admin-q" placeholder="Qidirish..." data-i18n-placeholder="admin.search" aria-label="Qidirish" data-i18n-aria="admin.search"></div>
            <select class="select" id="admin-status" style="width:auto" aria-label="Status"></select>
          </div>
          <div class="table-wrap"><table class="table" id="cars-table"></table></div>
        </div>

        <div id="tab-leads" hidden>
          <div id="leads"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/cars.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/admin.js"></script>
</body>
</html>
